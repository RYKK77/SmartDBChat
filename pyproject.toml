[project]
name = "smartdbchat"
version = "0.3.0"
description = "基于大语言模型的自然语言数据库查询与可视化系统（NL2SQL + FastAPI/React 工作台 + Schema 图谱 + 语义层 + 流式分析）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "mysql-connector-python>=9.2.0",
    "numpy>=1.26.4",
    "openai>=1.60.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "pygments>=2.18.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.3",
    "sqlglot>=30.31.0",
    "streamlit>=1.40.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
smartdbchat-server = "smartdbchat.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
